<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Supply — 37signals</title>
    <meta
      name="description"
      content="Supply — Ersatzteilkatalog statt Shop: 12 Collections, drei Screen-Typen, Navigation ausschliesslich horizontal."
    />
    <script type="module" crossorigin src="./assets/index-DJ_yjhMR.js"></script>
    <link rel="stylesheet" crossorigin href="./assets/index-DOHWSeMy.css">
  </head>
  <body>
    <!--
      Chrome der Site: weisser Header, sonst nichts. Kein Cart-Icon, kein Menue,
      kein Hamburger, kein Icon-Set — die Pfeile im Deck sind Text-Glyphen.
      Das Molekuel-Zeichen steht als Inline-SVG statt als Glyph `⁘`, weil U+2058
      in Inter nicht sicher belegt ist.
    -->
    <header class="masthead">
      <h1 class="masthead__title">
        <a class="masthead__link" href="#/">
          <svg class="masthead__mark" viewBox="0 0 100 100" aria-hidden="true" focusable="false">
            <line
              x1="26"
              y1="26"
              x2="74"
              y2="74"
              fill="none"
              stroke="currentColor"
              stroke-width="7"
              stroke-linecap="round"
            />
            <circle cx="26" cy="26" r="14" fill="currentColor" />
            <circle cx="74" cy="26" r="14" fill="currentColor" />
            <circle cx="26" cy="74" r="14" fill="currentColor" />
            <circle cx="74" cy="74" r="14" fill="currentColor" />
          </svg>
          Supply
        </a>
      </h1>
      <a
        class="masthead__link masthead__link--parent"
        href="https://37signals.com"
        rel="noreferrer"
      >
        37signals
        <svg class="masthead__mark" viewBox="0 0 100 100" aria-hidden="true" focusable="false">
          <line
            x1="26"
            y1="74"
            x2="74"
            y2="26"
            fill="none"
            stroke="currentColor"
            stroke-width="7"
            stroke-linecap="round"
          />
          <circle cx="26" cy="26" r="14" fill="currentColor" />
          <circle cx="74" cy="26" r="14" fill="currentColor" />
          <circle cx="26" cy="74" r="14" fill="currentColor" />
          <circle cx="74" cy="74" r="14" fill="currentColor" />
        </svg>
      </a>
    </header>

    <!-- Die Buehne: schwarzes Panel, exakt der Rest des Viewports, einziger Scroll-Container. -->
    <main class="stage" id="stage"></main>

    <!-- Die einzige Cart-Chrome der Site — existiert erst nach dem Kauf-Klick. -->
    <div
      class="modal"
      id="modal"
      role="dialog"
      aria-modal="true"
      aria-labelledby="modal-title"
      hidden
    >
      <div class="modal__frame">
        <p class="modal__text" id="modal-title"></p>
        <button class="modal__close" id="modal-close" type="button">Close</button>
      </div>
    </div>

    <p class="sr-only" id="announcer" role="status" aria-live="polite"></p>

  </body>
</html>
